title: curriculum-2027
description: "Adron's path through three AWS AI certifications: AIF-C01, MLA-C02, and AIP-C01. Topic notes, punch lists, workbooks, and a running build."
author: Adron Hall
url: "https://adron.github.io"
baseurl: "/curriculum-2027"
repository: Adron/curriculum-2027

# Custom hacker theme lives in _layouts, _includes, and assets/. No remote theme.
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings

readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: true

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - "*.zip"
  - ".curriculum-2027-work"
  - "vendor"
  - "node_modules"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "scripts"

defaults:
  - scope:
      path: ""
    values:
      layout: default
