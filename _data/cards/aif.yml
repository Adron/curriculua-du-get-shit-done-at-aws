- id: "aif-01-1"
  topic: "01-ai-ml-terminology-and-concepts"
  q: "Training vs inference: which one is offline and expensive, and which one serves outputs for new inputs?"
  a: "Training fits the model's parameters on data, offline and expensive. Inference uses the trained model to produce outputs for new inputs, online or batch."
- id: "aif-01-2"
  topic: "01-ai-ml-terminology-and-concepts"
  q: "Labeled data, predict fraud yes/no. Supervised, unsupervised, or reinforcement?"
  a: "Supervised. Labeled data and a known target. Unsupervised is for finding groups in unlabeled data; reinforcement learns a policy from rewards."
- id: "aif-01-3"
  topic: "01-ai-ml-terminology-and-concepts"
  q: "Quick triage: prediction on labels, create content, or multi-step with tools. Which approach does each point to?"
  a: "Prediction on labels: supervised ML. Create content: GenAI. Multi-step with tools: agentic AI."
- id: "aif-01-4"
  topic: "01-ai-ml-terminology-and-concepts"
  q: "What separates agentic AI from a chatbot?"
  a: "Agents plan, use tools, keep memory, and take multi-step actions toward a goal. A chatbot just converses."
- id: "aif-01-5"
  topic: "01-ai-ml-terminology-and-concepts"
  q: "Tabular prediction with a strong explainability requirement. LLM or traditional ML?"
  a: "Traditional ML (regression, trees). Not everything needs an LLM."
- id: "aif-02-1"
  topic: "02-ai-use-cases-and-technique-selection"
  q: "You need an exact, deterministic result like a tax calculation or ledger balance. Is AI/ML the answer?"
  a: "No. Probabilistic predictions are the wrong tool when you need a deterministic, exact outcome. Use rules."
- id: "aif-02-2"
  topic: "02-ai-use-cases-and-technique-selection"
  q: "Regression, classification, or clustering: predict demand as a number?"
  a: "Regression. It outputs a continuous number. Classification outputs discrete classes; clustering finds groups without labels."
- id: "aif-02-3"
  topic: "02-ai-use-cases-and-technique-selection"
  q: "Call center audio to insights. Which AWS services?"
  a: "Transcribe for speech to text, then Comprehend for entities and sentiment (or Bedrock for a free-form summary)."
- id: "aif-02-4"
  topic: "02-ai-use-cases-and-technique-selection"
  q: "A purpose-built API (Textract, Rekognition, Comprehend) already solves the narrow task. Prompt an LLM anyway?"
  a: "No. Use the purpose-built service. It's usually cheaper, more consistent, and easier to govern."
- id: "aif-02-5"
  topic: "02-ai-use-cases-and-technique-selection"
  q: "Which AWS service builds chatbots and voice bots with intents and dialog?"
  a: "Amazon Lex. Polly is text to speech; Transcribe is speech to text."
- id: "aif-03-1"
  topic: "03-ai-ml-lifecycle-and-mlops-basics"
  q: "Rare fraud cases, model has 99% accuracy. Why is that not good enough?"
  a: "High accuracy can hide terrible recall on a rare class. For fraud, optimize recall: of the actual positives, how many did you find?"
- id: "aif-03-2"
  topic: "03-ai-ml-lifecycle-and-mlops-basics"
  q: "Precision vs recall in one line each."
  a: "Precision: of the predicted positives, how many were right. Recall: of the actual positives, how many you found. F1 is their harmonic mean."
- id: "aif-03-3"
  topic: "03-ai-ml-lifecycle-and-mlops-basics"
  q: "Bedrock vs SageMaker in one line."
  a: "Bedrock is the managed FM API, pay per token, AWS runs the infra. SageMaker is where you train and host, size the capacity, and get more control."
- id: "aif-03-4"
  topic: "03-ai-ml-lifecycle-and-mlops-basics"
  q: "Is MLOps just CI/CD for models?"
  a: "No. It also covers experiment tracking, repeatability, monitoring, retraining triggers, and production readiness."
- id: "aif-03-5"
  topic: "03-ai-ml-lifecycle-and-mlops-basics"
  q: "Do foundation models eliminate the ML lifecycle?"
  a: "No. You still select, evaluate, deploy, and monitor them."
- id: "aif-04-1"
  topic: "04-genai-foundational-concepts"
  q: "Embeddings vs fine-tuning: which one updates model weights?"
  a: "Fine-tuning. Embeddings are numeric vectors of meaning used for similarity search and retrieval. No weights change."
- id: "aif-04-2"
  topic: "04-genai-foundational-concepts"
  q: "What drives the cost of an FM call?"
  a: "Input plus output tokens (sometimes cached tokens too). Long prompts, few-shot examples, big RAG contexts, and long outputs all add up."
- id: "aif-04-3"
  topic: "04-genai-foundational-concepts"
  q: "Is MCP a model?"
  a: "No. MCP (Model Context Protocol) is a standard way to connect agents to external tools and data sources."
- id: "aif-04-4"
  topic: "04-genai-foundational-concepts"
  q: "Scenario says 'put the whole long document in the prompt.' What should you translate that to?"
  a: "Chunk, embed, retrieve. That's RAG, instead of stuffing the corpus into the context window."
- id: "aif-04-5"
  topic: "04-genai-foundational-concepts"
  q: "Prompt engineering vs context engineering?"
  a: "Prompt engineering is how you word the instructions. Context engineering is what goes in the finite window: system prompt, history, retrieved docs, tool results."
- id: "aif-05-1"
  topic: "05-genai-capabilities-limitations-selection"
  q: "Name five ways to mitigate hallucinations."
  a: "RAG grounding, citations, Guardrails contextual grounding checks, output validation, human review. Plus lower temperature for factual tasks."
- id: "aif-05-2"
  topic: "05-genai-capabilities-limitations-selection"
  q: "Same prompt, different answers. Bug?"
  a: "No. Nondeterminism is how sampling works. Control it with temperature and top-p, and catch regressions with eval harnesses."
- id: "aif-05-3"
  topic: "05-genai-capabilities-limitations-selection"
  q: "Model metrics look good. Is that enough to justify the GenAI project?"
  a: "No. Pair model metrics (toxicity, groundedness) with business KPIs like ROI, task completion, CSAT, and cost per interaction."
- id: "aif-05-4"
  topic: "05-genai-capabilities-limitations-selection"
  q: "Compliance-sensitive use case over enterprise data. What's the starting architecture?"
  a: "Bedrock plus RAG plus Guardrails, before you even think about fine-tuning."
- id: "aif-06-1"
  topic: "06-aws-genai-infrastructure-and-services"
  q: "Persona test: business user asking questions over company data. Which service?"
  a: "Amazon Quick. Not Bedrock, which is the builder API."
- id: "aif-06-2"
  topic: "06-aws-genai-infrastructure-and-services"
  q: "Persona test: developer building software with AI assistance, spec-driven. Which service?"
  a: "Kiro, the AI IDE."
- id: "aif-06-3"
  topic: "06-aws-genai-infrastructure-and-services"
  q: "AgentCore vs Strands?"
  a: "Strands is the open-source SDK you write agent logic in. AgentCore is the managed platform that deploys and operates agents (runtime, memory, identity, observability, gateway)."
- id: "aif-06-4"
  topic: "06-aws-genai-infrastructure-and-services"
  q: "You want open weights running on your own endpoints. Bedrock or JumpStart?"
  a: "SageMaker JumpStart. Bedrock is managed FM APIs where you don't touch model infra."
- id: "aif-06-5"
  topic: "06-aws-genai-infrastructure-and-services"
  q: "When does provisioned throughput make sense over on-demand tokens?"
  a: "Steady high volume or latency SLAs. Prototype on on-demand first; reserve capacity once volume justifies it."
- id: "aif-07-1"
  topic: "07-fm-application-design-rag-agents"
  q: "Product docs change weekly, answers must be grounded in them. Prompt, RAG, or fine-tune?"
  a: "RAG. Fine-tuning bakes in a snapshot and changes behavior, not facts. RAG pulls current docs at query time with citations."
- id: "aif-07-2"
  topic: "07-fm-application-design-rag-agents"
  q: "Compliance Q&A where answers must be factual. High or low temperature?"
  a: "Low. Lower temperature is more deterministic and focused. Save high temperature for brainstorming."
- id: "aif-07-3"
  topic: "07-fm-application-design-rag-agents"
  q: "What's the default customization path?"
  a: "Prompt first, add RAG if you need knowledge or grounding, fine-tune only if that still isn't enough."
- id: "aif-07-4"
  topic: "07-fm-application-design-rag-agents"
  q: "Name four vector store options from the exam guide."
  a: "OpenSearch Service, Aurora, Neptune, and RDS for PostgreSQL (pgvector)."
- id: "aif-07-5"
  topic: "07-fm-application-design-rag-agents"
  q: "Draw the RAG loop in seven words."
  a: "Ingest, chunk, embed, index, retrieve, generate, cite."
- id: "aif-07-6"
  topic: "07-fm-application-design-rag-agents"
  q: "A single question answered from docs. Do you need an agent?"
  a: "No. A single RAG call does it. Agents are for multi-step workflows with tools and memory."
- id: "aif-08-1"
  topic: "08-prompt-engineering-techniques"
  q: "You need the model to always return the same JSON format. Which technique?"
  a: "Few-shot. Several examples lock in format and style consistency."
- id: "aif-08-2"
  topic: "08-prompt-engineering-techniques"
  q: "Multi-step reasoning or math. Which technique?"
  a: "Chain-of-thought: ask the model to reason step by step."
- id: "aif-08-3"
  topic: "08-prompt-engineering-techniques"
  q: "What does Bedrock Prompt Management actually give you?"
  a: "Versioning, variants, and variables for reusable prompts, with side-by-side testing. It's not a different model."
- id: "aif-08-4"
  topic: "08-prompt-engineering-techniques"
  q: "Jailbreaking vs hijacking?"
  a: "Jailbreaking tricks the model into ignoring safety or policy. Hijacking is injected instructions overriding the system's intent."
- id: "aif-08-5"
  topic: "08-prompt-engineering-techniques"
  q: "Can a well-written system prompt stop jailbreaks by itself?"
  a: "No. You need Guardrails (prompt attack filters), least privilege on tools, and input/output filtering. And never put secrets in prompts."
- id: "aif-09-1"
  topic: "09-fm-training-and-fine-tuning"
  q: "Fine-tuning vs RAG in five words."
  a: "Fine-tuning changes behavior. RAG adds facts."
- id: "aif-09-2"
  topic: "09-fm-training-and-fine-tuning"
  q: "What is distillation?"
  a: "Training a smaller student model to mimic a larger teacher, for cheaper and faster inference. Not the same as RAG."
- id: "aif-09-3"
  topic: "09-fm-training-and-fine-tuning"
  q: "What kind of data does RLHF use?"
  a: "Human preference rankings. Raters rank outputs to shape preferred behavior, which is different from plain supervised labels."
- id: "aif-09-4"
  topic: "09-fm-training-and-fine-tuning"
  q: "Model hallucinates about company policies. Fine-tune it?"
  a: "No. Use RAG plus grounding. Fine-tuning doesn't fix missing or changing facts."
- id: "aif-09-5"
  topic: "09-fm-training-and-fine-tuning"
  q: "Should you bake rapidly changing or erasable personal data into model weights?"
  a: "No. Inject it at inference time with RAG. Weights are hard to update and nearly impossible to erase from."
- id: "aif-10-1"
  topic: "10-fm-evaluation-methods-and-metrics"
  q: "ROUGE vs BLEU vs BERTScore?"
  a: "ROUGE: recall-oriented n-gram overlap with reference summaries. BLEU: precision-oriented n-gram overlap, classic for translation. BERTScore: semantic similarity with contextual embeddings."
- id: "aif-10-2"
  topic: "10-fm-evaluation-methods-and-metrics"
  q: "Brand-sensitive or regulated content. Automatic metrics or human-in-the-loop?"
  a: "Human-in-the-loop. Automatic metrics don't judge brand voice, safety, or high-risk decisions well."
- id: "aif-10-3"
  topic: "10-fm-evaluation-methods-and-metrics"
  q: "Which AWS feature compares and selects FMs on custom metrics like accuracy, robustness, and toxicity?"
  a: "Amazon Bedrock Model Evaluation."
- id: "aif-10-4"
  topic: "10-fm-evaluation-methods-and-metrics"
  q: "Evaluating a RAG app. What are you missing if you only score the LLM's answers?"
  a: "Retrieval quality: relevance of retrieved chunks, groundedness, and citation correctness."
- id: "aif-10-5"
  topic: "10-fm-evaluation-methods-and-metrics"
  q: "Name three things to measure for an agent."
  a: "Tool selection accuracy, step success, and end-to-end task completion. Also unsafe tool use rate and trajectory quality."
- id: "aif-11-1"
  topic: "11-responsible-ai-principles-and-practices"
  q: "List the Bedrock Guardrails filter types."
  a: "Content filters (including prompt attack), denied topics, word filters, sensitive information (PII) filters, contextual grounding checks, and Automated Reasoning checks."
- id: "aif-11-2"
  topic: "11-responsible-ai-principles-and-practices"
  q: "Hiring model shows biased outcomes. What's the fix chain?"
  a: "Balance the dataset, detect bias with SageMaker Clarify, and add human audits. Fixing only at inference leaves skewed training data."
- id: "aif-11-3"
  topic: "11-responsible-ai-principles-and-practices"
  q: "Besides accuracy, what responsible-AI factor belongs in model selection?"
  a: "Environmental and sustainability considerations: training and inference energy."
- id: "aif-11-4"
  topic: "11-responsible-ai-principles-and-practices"
  q: "Is an open-source model automatically fair or safe?"
  a: "No. Open weights don't guarantee fairness or safety. You still evaluate and add controls."
- id: "aif-12-1"
  topic: "12-transparency-and-explainability"
  q: "Using an opaque FM. Where does transparency come from?"
  a: "Process: Model Cards, evals, citations, and UI explanations. Not full mechanistic interpretability."
- id: "aif-12-2"
  topic: "12-transparency-and-explainability"
  q: "Scenario mentions audit, governance, and intended use. Which tool?"
  a: "SageMaker Model Cards: intended and not-intended uses, risk rating, training and eval metrics, caveats."
- id: "aif-12-3"
  topic: "12-transparency-and-explainability"
  q: "Third-party FM on Bedrock. Can you skip the Model Card?"
  a: "No. You still document your application's intended use."
- id: "aif-12-4"
  topic: "12-transparency-and-explainability"
  q: "What does transparency mean for an agent?"
  a: "Tool traces and decision logs (observability), not just model internals."
- id: "aif-13-1"
  topic: "13-securing-ai-systems"
  q: "Does an FM enforce row-level access control over what it knows?"
  a: "No. If it's in the context it can come out in the answer. Filter data with IAM before it enters the context."
- id: "aif-13-2"
  topic: "13-securing-ai-systems"
  q: "On RetrieveAndGenerate, what do Guardrails apply to?"
  a: "The user input and the model output. Not automatically to every retrieved chunk."
- id: "aif-13-3"
  topic: "13-securing-ai-systems"
  q: "Which service discovers PII sitting in S3 training or Knowledge Base corpora?"
  a: "Amazon Macie."
- id: "aif-13-4"
  topic: "13-securing-ai-systems"
  q: "Traffic to Bedrock must not touch the public internet. Which service?"
  a: "AWS PrivateLink."
- id: "aif-13-5"
  topic: "13-securing-ai-systems"
  q: "Where do tool credentials go?"
  a: "Secrets Manager. Never in prompts."
- id: "aif-14-1"
  topic: "14-ai-governance-and-compliance"
  q: "Name the five Generative AI Security Scoping Matrix scopes."
  a: "1 Consumer app, 2 Enterprise app, 3 Pre-trained models via API, 4 Fine-tuned models, 5 Self-trained models. Higher scope means more of the security is on you."
- id: "aif-14-2"
  topic: "14-ai-governance-and-compliance"
  q: "Your app calls Claude on Bedrock with RAG. Which scope?"
  a: "Scope 3: pre-trained models through an API."
- id: "aif-14-3"
  topic: "14-ai-governance-and-compliance"
  q: "Auditor needs AWS's SOC report. Which service?"
  a: "AWS Artifact. CloudTrail is who called the API; Config is resource configuration compliance."
- id: "aif-14-4"
  topic: "14-ai-governance-and-compliance"
  q: "Who invoked the model, and when? Which service answers that?"
  a: "AWS CloudTrail."
- id: "aif-14-5"
  topic: "14-ai-governance-and-compliance"
  q: "Fine-tuned on PII, now a GDPR erasure request arrives. What's the problem?"
  a: "Removing it may mean deleting the data and retraining, which is often impractical. Keep erasable PII out of weights and use RAG."
