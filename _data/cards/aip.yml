- id: "aip-01-1"
  topic: "01-genai-solution-design-and-requirements"
  q: "What do you capture before picking any model or pattern?"
  a: "Non-functional requirements: p95 latency, token budget, data residency, allowed tool agency, auditability, and HITL for irreversible actions."
- id: "aip-01-2"
  topic: "01-genai-solution-design-and-requirements"
  q: "The playground demo works great. Production ready?"
  a: "No. Without Guardrails, logging, and eval gates it's still a demo."
- id: "aip-01-3"
  topic: "01-genai-solution-design-and-requirements"
  q: "Bedrock managed inference vs SageMaker for a GenAI app. Default and exceptions?"
  a: "Default to Bedrock. Use SageMaker when you need custom containers, ownership of the LoRA lifecycle, or hybrid endpoints."
- id: "aip-01-4"
  topic: "01-genai-solution-design-and-requirements"
  q: "Which AWS framework do you standardize a GenAI architecture against?"
  a: "The Well-Architected Generative AI Lens, reviewed in the Well-Architected Tool."
- id: "aip-02-1"
  topic: "02-fm-selection-and-configuration"
  q: "Does Provisioned Throughput work with cross-Region inference profiles?"
  a: "No. Plan fallbacks instead: retry, degrade to a smaller model, or queue."
- id: "aip-02-2"
  topic: "02-fm-selection-and-configuration"
  q: "EU data residency required. Geographic or Global cross-Region inference?"
  a: "Geographic. Global profiles save roughly 10% but only when compliance allows data to leave the geography."
- id: "aip-02-3"
  topic: "02-fm-selection-and-configuration"
  q: "How do you make model swaps cheap?"
  a: "Use Converse for model-portable code, and resolve modelId or inference profile from AppConfig or Parameter Store, routed through API Gateway and Lambda."
- id: "aip-02-4"
  topic: "02-fm-selection-and-configuration"
  q: "You customized a Bedrock model. What does invoking it typically require?"
  a: "Provisioned Throughput."
- id: "aip-02-5"
  topic: "02-fm-selection-and-configuration"
  q: "LoRA adapters in production. What lifecycle tooling?"
  a: "SageMaker Model Registry for versions, approval stages, deploy, and rollback. Automate retiring superseded adapters."
- id: "aip-03-1"
  topic: "03-data-validation-and-processing-for-fms"
  q: "Bad rows heading into a KB sync. What catches them?"
  a: "Glue Data Quality DQDL rulesets that fail or quarantine bad rows before sync, with DQ scores emitted to CloudWatch."
- id: "aip-03-2"
  topic: "03-data-validation-and-processing-for-fms"
  q: "Scanned documents and audio feeding RAG. What's the prep path?"
  a: "Textract, Transcribe, or Bedrock Data Automation into normalized text plus metadata, then embeddings. Keep modality-specific parsers."
- id: "aip-03-3"
  topic: "03-data-validation-and-processing-for-fms"
  q: "Enrichment pipeline before inference or RAG ingest?"
  a: "Comprehend for entities and PII, Lambda to normalize units, dates, and IDs, optionally a Bedrock rewrite. Store lineage: source URI and transform version."
- id: "aip-03-4"
  topic: "03-data-validation-and-processing-for-fms"
  q: "Large binary payloads to the FM API. What's the move?"
  a: "Respect API limits and pass S3 references instead of raw large payloads."
- id: "aip-04-1"
  topic: "04-vector-store-solutions"
  q: "RAG at scale needing both lexical and semantic search. Which vector store?"
  a: "OpenSearch: k-NN plus hybrid BM25 and vector."
- id: "aip-04-2"
  topic: "04-vector-store-solutions"
  q: "Vectors need to join against transactional metadata in SQL. Which store?"
  a: "Aurora or RDS PostgreSQL with pgvector (HNSW or IVFFlat)."
- id: "aip-04-3"
  topic: "04-vector-store-solutions"
  q: "When do DynamoDB native vectors fit, and what's their gap?"
  a: "Sub-10ms operational RAG or agent memory when the data already lives in DynamoDB. For full-text or hybrid search, pair with OpenSearch zero-ETL."
- id: "aip-04-4"
  topic: "04-vector-store-solutions"
  q: "Multi-tenant RAG. What stops one tenant's chunks showing up for another?"
  a: "Metadata filters (tenant, ACL) on retrieval. Without them, retrieval happily returns chunks the user should never see."
- id: "aip-04-5"
  topic: "04-vector-store-solutions"
  q: "One doc changed. Full reindex?"
  a: "No. Incremental sync via S3 notifications or EventBridge. Full reindex only when the embedding model changes."
- id: "aip-05-1"
  topic: "05-retrieval-mechanisms-and-rag"
  q: "You switched embedding models. What must happen to the index?"
  a: "Reindex. Never mix embedding models in one index without a migration; dimensions and vector spaces differ."
- id: "aip-05-2"
  topic: "05-retrieval-mechanisms-and-rag"
  q: "Fully managed Bedrock KB: semantic-only or hybrid search by default?"
  a: "Hybrid (keyword plus vector) is the managed default."
- id: "aip-05-3"
  topic: "05-retrieval-mechanisms-and-rag"
  q: "Hierarchical chunking returns fewer results than numberOfResults. Why?"
  a: "Parent collapse: multiple child hits expand to the same parent chunk."
- id: "aip-05-4"
  topic: "05-retrieval-mechanisms-and-rag"
  q: "Multi-hop question that retrieval keeps missing. Which techniques help?"
  a: "Query expansion and Lambda decomposition of the multi-hop question, plus reranking."
- id: "aip-05-5"
  topic: "05-retrieval-mechanisms-and-rag"
  q: "Why expose retrieval as an MCP or function-calling tool?"
  a: "Agents and apps share one access pattern, and you validate parameters and enforce ACLs in the tool layer."
- id: "aip-06-1"
  topic: "06-prompt-engineering-and-governance"
  q: "Prompts are production artifacts. What does that mean concretely?"
  a: "Versioned in Prompt Management, reviewed and approved, regression-tested on golden prompts, CloudTrail on management APIs, invocation logging at runtime."
- id: "aip-06-2"
  topic: "06-prompt-engineering-and-governance"
  q: "Swapping the model behind the same prompt ARN. What must run first?"
  a: "A regression suite on golden prompts."
- id: "aip-06-3"
  topic: "06-prompt-engineering-and-governance"
  q: "Sequential prompt chain with branches and pre/post-processing, low code. Which feature?"
  a: "Bedrock Prompt Flows."
- id: "aip-06-4"
  topic: "06-prompt-engineering-and-governance"
  q: "Chain-of-thought on every request. Problem?"
  a: "Cost and latency. Use a structured extract when that does the job."
- id: "aip-07-1"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "Agent Squad vs AgentCore?"
  a: "Agent Squad is an open-source intent router across specialized agents. AgentCore is the managed platform: Runtime, Gateway, Memory, Identity, Observability."
- id: "aip-07-2"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "Turn existing Lambda functions and OpenAPI specs into MCP tools with auth. Which service?"
  a: "AgentCore Gateway."
- id: "aip-07-3"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "Need deterministic stop conditions on a ReAct loop. Strands or Step Functions?"
  a: "Step Functions for an explicit state machine. Strands when you want FM-driven planning."
- id: "aip-07-4"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "Agent can issue refunds and deletes. What control?"
  a: "Human-in-the-loop: Step Functions wait-for-task-token or an approval UI before the side effect."
- id: "aip-07-5"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "Name four agent safeguards."
  a: "Timeouts, max tool iterations, IAM resource boundaries, circuit breakers. Plus Guardrails on agent prompts and responses."
- id: "aip-07-6"
  topic: "07-agentic-ai-and-tool-integrations"
  q: "MCP tool with no authn/authz. What's the risk called?"
  a: "Confused deputy."
- id: "aip-08-1"
  topic: "08-model-deployment-strategies"
  q: "Bursty, variable GenAI traffic. Deployment default?"
  a: "On-demand Bedrock via Lambda, pay per token, async through SQS for long jobs."
- id: "aip-08-2"
  topic: "08-model-deployment-strategies"
  q: "What are the Provisioned Throughput commitment options?"
  a: "No commitment, 1 month, or 6 months, bought in Model Units. Not usable with inference profiles."
- id: "aip-08-3"
  topic: "08-model-deployment-strategies"
  q: "One of the biggest GenAI cost levers in deployment?"
  a: "Cascading: small models for classification and routing, escalate to larger models only when needed."
- id: "aip-08-4"
  topic: "08-model-deployment-strategies"
  q: "General FM calls plus a domain LoRA model. Architecture?"
  a: "Hybrid: Bedrock for general calls, a SageMaker endpoint for the LoRA or custom container, one app-level router."
- id: "aip-09-1"
  topic: "09-enterprise-integration-architectures"
  q: "Every microservice calls FMs directly. What's missing?"
  a: "A GenAI gateway: one door for model routing, auth, quotas, guardrails, and observability."
- id: "aip-09-2"
  topic: "09-enterprise-integration-architectures"
  q: "Data must stay on-prem vs ultra-low-latency at the edge. Which services?"
  a: "On-prem data gravity: Outposts. Ultra-low-latency edge: Wavelength."
- id: "aip-09-3"
  topic: "09-enterprise-integration-architectures"
  q: "Sync UX vs async document ingest and fan-out. Which integration pattern for each?"
  a: "Sync: API Gateway microservices. Async: EventBridge or SQS, loosely coupled from systems of record."
- id: "aip-09-4"
  topic: "09-enterprise-integration-architectures"
  q: "Shipping prompt and agent changes through CI/CD. What gates?"
  a: "Automated evals and security scans, staged rollouts, and rollback on quality regression."
- id: "aip-10-1"
  topic: "10-fm-api-integrations"
  q: "Inference calls go to which endpoint: bedrock or bedrock-runtime?"
  a: "bedrock-runtime. The bedrock endpoint is the control plane."
- id: "aip-10-2"
  topic: "10-fm-api-integrations"
  q: "ThrottlingException under load. Right response?"
  a: "SDK exponential backoff with jitter, queue the overflow, and circuit-break to a smaller model. Busy-loop retries make throttling worse."
- id: "aip-10-3"
  topic: "10-fm-api-integrations"
  q: "Multi-minute generation job behind API Gateway. Sync call?"
  a: "No. API Gateway sync has a 29-second limit. Go async with SQS and Lambda workers, results in S3."
- id: "aip-10-4"
  topic: "10-fm-api-integrations"
  q: "Streaming API returns everything at once to the client. What went wrong?"
  a: "The server buffered the full stream before returning it. Pass ConverseStream chunks through via WebSocket or SSE."
- id: "aip-10-5"
  topic: "10-fm-api-integrations"
  q: "Converse vs InvokeModel?"
  a: "Converse for portable chat and tool use across models. InvokeModel when you need raw model-specific bodies."
- id: "aip-11-1"
  topic: "11-application-integration-patterns"
  q: "Business users need a GenAI workflow without custom UI code. Which feature?"
  a: "Bedrock Prompt Flows. Wrong pick if you need complex custom tool auth or MCP."
- id: "aip-11-2"
  topic: "11-application-integration-patterns"
  q: "Does Bedrock Data Automation PII redaction rewrite the source files?"
  a: "No. By default it applies to BDA's JSON outputs."
- id: "aip-11-3"
  topic: "11-application-integration-patterns"
  q: "Q Developer generated the code. Ship it?"
  a: "Not without a correctness and security review."
- id: "aip-11-4"
  topic: "11-application-integration-patterns"
  q: "Multimodal extraction from documents for a business workflow. Which service?"
  a: "Bedrock Data Automation, with optional PII detection and redaction in its outputs."
- id: "aip-12-1"
  topic: "12-input-output-safety-controls"
  q: "Prompt attack filter enabled on InvokeModel, injections still get through. Why?"
  a: "User inputs weren't tagged. Tag user input or the prompt attack filter may not evaluate it."
- id: "aip-12-2"
  topic: "12-input-output-safety-controls"
  q: "Does the prompt attack filter evaluate tool results and tool specs?"
  a: "No. Treat tool output as untrusted and validate it elsewhere."
- id: "aip-12-3"
  topic: "12-input-output-safety-controls"
  q: "Defense-in-depth order for GenAI safety?"
  a: "Comprehend toxicity/PII pre-filter, Guardrails at the model, Lambda schema and business-rule checks, then API Gateway response filters."
- id: "aip-12-4"
  topic: "12-input-output-safety-controls"
  q: "Can you attach Guardrails to embedding, image-gen, or rerank models?"
  a: "No. Unsupported."
- id: "aip-12-5"
  topic: "12-input-output-safety-controls"
  q: "A system prompt that says 'please be safe.' Is it a control?"
  a: "No. It's a wish. Use Guardrails and app-level checks."
- id: "aip-13-1"
  topic: "13-data-security-and-privacy"
  q: "Which interface VPC endpoints keep Bedrock traffic private?"
  a: "bedrock, bedrock-runtime, bedrock-agent, and bedrock-agent-runtime (FIPS where required), with private DNS."
- id: "aip-13-2"
  topic: "13-data-security-and-privacy"
  q: "Outputs are redacted, but raw PII was indexed into the vector store. Problem?"
  a: "Yes. Redact with Comprehend before KB ingest. Output-only redaction leaves PII in retrieval."
- id: "aip-13-3"
  topic: "13-data-security-and-privacy"
  q: "Invocation logs kept forever for debugging. Fix?"
  a: "S3 Lifecycle on logs, chat history, and eval data, DynamoDB TTLs, and minimal prompt/response retention in CloudWatch."
- id: "aip-13-4"
  topic: "13-data-security-and-privacy"
  q: "Data lake permissions for FM workloads. Which service, besides IAM?"
  a: "AWS Lake Formation."
- id: "aip-14-1"
  topic: "14-ai-governance-and-compliance"
  q: "Regulated RAG scenario. What must every answer carry?"
  a: "Source attribution: KB metadata flowing through to citations."
- id: "aip-14-2"
  topic: "14-ai-governance-and-compliance"
  q: "Where do you register corpora for lineage?"
  a: "The AWS Glue Data Catalog."
- id: "aip-14-3"
  topic: "14-ai-governance-and-compliance"
  q: "Bias monitored at launch only. Enough?"
  a: "No. Monitor continuously: misuse, policy violations, and bias drift, with automated alerts."
- id: "aip-14-4"
  topic: "14-ai-governance-and-compliance"
  q: "Stop teams from spinning up shadow-IT model keys. Which service offers approved GenAI products?"
  a: "AWS Service Catalog."
- id: "aip-15-1"
  topic: "15-responsible-ai-principles"
  q: "Fairness eval shows good aggregate accuracy. Done?"
  a: "No. Aggregate accuracy hides subgroup harm. Evaluate across slices."
- id: "aip-15-2"
  topic: "15-responsible-ai-principles"
  q: "Org policy lives in a PDF. How do you enforce it at inference?"
  a: "Encode it as Guardrails (denied topics, word filters, grounding), and check for the required guardrail ARN in CI."
- id: "aip-15-3"
  topic: "15-responsible-ai-principles"
  q: "Same model as generator and judge. Risk?"
  a: "Self-preference bias. Still common, so document your mitigations."
- id: "aip-15-4"
  topic: "15-responsible-ai-principles"
  q: "Human oversight for contested decisions. Which services?"
  a: "Amazon Augmented AI (A2I) or Step Functions HITL."
- id: "aip-16-1"
  topic: "16-cost-optimization-and-resource-efficiency"
  q: "Does prompt caching work with batch inference?"
  a: "No. On-demand only."
- id: "aip-16-2"
  topic: "16-cost-optimization-and-resource-efficiency"
  q: "Near-duplicate user questions all day. Which cache?"
  a: "A semantic cache in ElastiCache, MemoryDB, or OpenSearch."
- id: "aip-16-3"
  topic: "16-cost-optimization-and-resource-efficiency"
  q: "Caching personalized or PII answers. What's required?"
  a: "Tenancy keys. Without them it's a data leak, not an optimization."
- id: "aip-16-4"
  topic: "16-cost-optimization-and-resource-efficiency"
  q: "Name three token-reduction moves."
  a: "Prune history, cap maxTokens, and retrieve fewer, better chunks. Also compress prompts."
- id: "aip-16-5"
  topic: "16-cost-optimization-and-resource-efficiency"
  q: "Provisioned Throughput for a low-duty PoC?"
  a: "No. Only for steady load or custom models that require it."
- id: "aip-17-1"
  topic: "17-application-performance-optimization"
  q: "What latency metric do chat users feel most?"
  a: "Time to first token. Stream responses."
- id: "aip-17-2"
  topic: "17-application-performance-optimization"
  q: "Optimizing model latency but p95 hasn't moved. Likely culprit?"
  a: "KB retrieval dominates p95. Profile prompt, retrieve, and generate spans and fix the slowest stage first."
- id: "aip-17-3"
  topic: "17-application-performance-optimization"
  q: "Autoscaling a GenAI service on CPU%. Better signals?"
  a: "Queue depth, concurrent streams, or token rate."
- id: "aip-17-4"
  topic: "17-application-performance-optimization"
  q: "Top 50 chunks into context 'for safety.' Good idea?"
  a: "No. It hurts latency, cost, and usually quality."
- id: "aip-18-1"
  topic: "18-monitoring-genai-applications"
  q: "Does Bedrock Model Invocation Logging capture calls to every endpoint?"
  a: "No. It covers Converse, ConverseStream, and InvokeModel on bedrock-runtime, not other endpoints such as bedrock-mantle."
- id: "aip-18-2"
  topic: "18-monitoring-genai-applications"
  q: "Model upgraded. What regression check runs?"
  a: "A golden-set evaluation against the previous baseline."
- id: "aip-18-3"
  topic: "18-monitoring-genai-applications"
  q: "Which CloudWatch metrics belong on a GenAI dashboard?"
  a: "Invocations, latency, input/output tokens by model, throttles, and errors. Alarm on throttle/error spikes and cost anomalies."
- id: "aip-18-4"
  topic: "18-monitoring-genai-applications"
  q: "Model latency looks fine but users report failures. What else are you watching?"
  a: "Tool-call success and latency in agent traces (AgentCore Observability), plus vector store query latency and ingest lag."
- id: "aip-19-1"
  topic: "19-evaluation-systems-for-genai"
  q: "RAG eval: retrieve-only vs retrieve-and-generate metrics?"
  a: "Retrieve-only: context relevance and coverage. Retrieve-and-generate: correctness, faithfulness, citation precision and coverage, harmfulness."
- id: "aip-19-2"
  topic: "19-evaluation-systems-for-genai"
  q: "New model is faster. Promote it?"
  a: "Not on latency alone. Check faithfulness first, then canary it."
- id: "aip-19-3"
  topic: "19-evaluation-systems-for-genai"
  q: "Safe way to swap a production model or prompt?"
  a: "CI quality gates, then canary traffic. Never a big-bang swap."
- id: "aip-19-4"
  topic: "19-evaluation-systems-for-genai"
  q: "What do you measure for an agent eval?"
  a: "Task completion, tool effectiveness, and multi-step reasoning quality."
- id: "aip-20-1"
  topic: "20-troubleshooting-genai-applications"
  q: "Answers degraded after an embedding model change. Blame the FM?"
  a: "No. The index is likely stale or mixed. Re-embed after an embedding model change."
- id: "aip-20-2"
  topic: "20-troubleshooting-genai-applications"
  q: "Works in the playground, fails in the app. What do you compare?"
  a: "Credentials and Region, model ID or inference profile, IAM, VPC endpoints, and payload schema."
- id: "aip-20-3"
  topic: "20-troubleshooting-genai-applications"
  q: "Context window overflow. Fixes in order?"
  a: "Shrink history, summarize prior turns, chunk dynamically. Move to a larger-window model only if needed."
- id: "aip-20-4"
  topic: "20-troubleshooting-genai-applications"
  q: "Agent tool silently fails. Where do you look?"
  a: "Agent traces for tool arguments and results: an IAM AccessDenied, MCP schema mismatch, timeout, or loop. Step Functions history for ReAct paths."
- id: "aip-20-5"
  topic: "20-troubleshooting-genai-applications"
  q: "Keep raising max tokens to get better answers?"
  a: "No. Fix the retrieval noise instead."
