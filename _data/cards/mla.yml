- id: "mla-01-1"
  topic: "01-data-collection-and-storage"
  q: "Feature Store: freshest features for inference vs point-in-time history for training. Online or offline store?"
  a: "Freshest features for inference: online store. Point-in-time and historical for training: offline store, append-only Parquet on S3."
- id: "mla-01-2"
  topic: "01-data-collection-and-storage"
  q: "Large training dataset on S3. CSV or Parquet?"
  a: "Parquet. Columnar, compressed, schema-aware. CSV is for simple small tabular data."
- id: "mla-01-3"
  topic: "01-data-collection-and-storage"
  q: "Many training workers need the same files. EBS or EFS?"
  a: "EFS, shared POSIX across instances. EBS is block storage attached to a single host."
- id: "mla-01-4"
  topic: "01-data-collection-and-storage"
  q: "Is DynamoDB the exam's answer for a vector database?"
  a: "No. The exam wants OpenSearch (k-NN), RDS pgvector, or S3 vectors. DynamoDB is for low-latency key-value feature lookups."
- id: "mla-01-5"
  topic: "01-data-collection-and-storage"
  q: "Vector search plus relational metadata in SQL. Which store?"
  a: "RDS with pgvector."
- id: "mla-02-1"
  topic: "02-data-transformation-feature-engineering"
  q: "What is train/serve skew, and what helps prevent it?"
  a: "Different transforms at training and inference time. Apply the same transforms in both places; Feature Store helps."
- id: "mla-02-2"
  topic: "02-data-transformation-feature-engineering"
  q: "Bedrock KB default chunking?"
  a: "About 300 tokens on sentence boundaries. Other options: fixed-size with overlap, hierarchical, semantic, or no chunking."
- id: "mla-02-3"
  topic: "02-data-transformation-feature-engineering"
  q: "Hierarchical chunking in one line."
  a: "Retrieve on small child chunks for precision, return the parent chunk for context."
- id: "mla-02-4"
  topic: "02-data-transformation-feature-engineering"
  q: "Anonymize PII in ETL vs Guardrails sensitive-info filters. Same control?"
  a: "No. ETL masking removes PII before training or RAG. Guardrails filter at inference time. Different stages."
- id: "mla-02-5"
  topic: "02-data-transformation-feature-engineering"
  q: "Chunk size tradeoff?"
  a: "Huge chunks dilute retrieval; tiny chunks lose context. Add overlap and metadata filters."
- id: "mla-02-6"
  topic: "02-data-transformation-feature-engineering"
  q: "Data shape for fine-tuning vs continued pre-training vs distillation?"
  a: "Fine-tuning: prompt-completion or chat pairs. Continued pre-training: large unlabeled domain corpus. Distillation: teacher outputs become the student's training set."
- id: "mla-03-1"
  topic: "03-data-quality-validation-and-bias"
  q: "Serverless data quality rules (DQDL) on Glue tables, with scores and quarantine. Which service?"
  a: "AWS Glue Data Quality, built on DeeQu. It can recommend rules for you to harden."
- id: "mla-03-2"
  topic: "03-data-quality-validation-and-bias"
  q: "Is measuring bias only after training enough?"
  a: "No. The exam wants pre-training data bias too: Clarify metrics like Class Imbalance (CI) and Difference in Proportions of Labels (DPL)."
- id: "mla-03-3"
  topic: "03-data-quality-validation-and-bias"
  q: "Name four mitigations for class imbalance."
  a: "Stratified splits, resampling (over/under), synthetic minority samples, reweighting. Or collect more minority data."
- id: "mla-03-4"
  topic: "03-data-quality-validation-and-bias"
  q: "What do you check in a fine-tuning corpus before training?"
  a: "Valid prompt-response pairs (no empty or truncated targets), toxic/PII screening, near-duplicate removal, and held-out eval sets that never leak."
- id: "mla-04-1"
  topic: "04-modeling-approach-selection"
  q: "Need OCR from scanned forms. Fine-tuned LLM or Textract?"
  a: "Textract. Managed AI services handle commodity perception tasks; the fine-tuned LLM is overbuilding."
- id: "mla-04-2"
  topic: "04-modeling-approach-selection"
  q: "Knowledge changes daily. Fine-tune or RAG?"
  a: "RAG. Fine-tune for consistent format, tone, or domain language, not for fresh facts."
- id: "mla-04-3"
  topic: "04-modeling-approach-selection"
  q: "Queries full of IDs, product codes, and rare terms. Which RAG pattern?"
  a: "Hybrid search: keyword plus vector."
- id: "mla-04-4"
  topic: "04-modeling-approach-selection"
  q: "Fastest RAG path vs most control?"
  a: "Fastest: fully managed KB with RetrieveAndGenerate. Most control: retrieve-only plus your own generation step for ranking, guards, and multi-step agents."
- id: "mla-04-5"
  topic: "04-modeling-approach-selection"
  q: "Giant FM with weak retrieval vs smaller FM with good retrieval?"
  a: "The smaller, faster FM with good retrieval often wins on quality, latency, and cost."
- id: "mla-05-1"
  topic: "05-train-fine-tune-customize-models"
  q: "Train metrics far better than validation. Diagnosis and fixes?"
  a: "Overfitting. More data, dropout, weight decay, early stopping, or a simpler model."
- id: "mla-05-2"
  topic: "05-train-fine-tune-customize-models"
  q: "Fine-tune wiped out the model's general skills. What's it called and how do you mitigate it?"
  a: "Catastrophic forgetting. Lower learning rate, fewer epochs, mix in replay data, use LoRA/adapters, and eval the old tasks."
- id: "mla-05-3"
  topic: "05-train-fine-tune-customize-models"
  q: "Data parallelism vs model parallelism?"
  a: "Data parallelism shards the data across workers for big datasets. Model parallelism shards the model itself for huge nets."
- id: "mla-05-4"
  topic: "05-train-fine-tune-customize-models"
  q: "What does SageMaker AMT use to cut losing trials short?"
  a: "Early stopping. And the objective metric has to match the business goal."
- id: "mla-05-5"
  topic: "05-train-fine-tune-customize-models"
  q: "RAG answers are bad. What do you measure before touching the generator?"
  a: "Retrieval hit rate (recall@k), separately from generation quality. Retrieval is often the real failure."
- id: "mla-05-6"
  topic: "05-train-fine-tune-customize-models"
  q: "Cheap fault-tolerant training. What's the combo?"
  a: "Spot instances plus checkpointing."
- id: "mla-06-1"
  topic: "06-model-and-system-evaluation"
  q: "Test a candidate model on real production traffic with zero user impact. Which pattern?"
  a: "Shadow variant: the candidate gets a copy of production traffic, and you compare metrics."
- id: "mla-06-2"
  topic: "06-model-and-system-evaluation"
  q: "GenAI quality regressed. What should you have logged to find it?"
  a: "Data version, code commit, and prompt version. GenAI regressions are often just a prompt diff."
- id: "mla-06-3"
  topic: "06-model-and-system-evaluation"
  q: "Track RAG quality in which three layers?"
  a: "Retrieval (recall@k, MRR, context relevance), generation (faithfulness, citation precision), end-to-end (task success, latency, abstain rate)."
- id: "mla-06-4"
  topic: "06-model-and-system-evaluation"
  q: "Managed experiment tracking on SageMaker that syncs to Model Registry?"
  a: "Managed MLflow on SageMaker."
- id: "mla-06-5"
  topic: "06-model-and-system-evaluation"
  q: "Is BLEU enough to judge open-ended chat?"
  a: "No. Pair it with human or LLM-as-judge rubrics for helpfulness, faithfulness, and safety."
- id: "mla-07-1"
  topic: "07-deployment-infrastructure"
  q: "Spiky or mostly idle traffic, cold starts are acceptable. Which SageMaker inference option?"
  a: "Serverless inference. Scale-to-zero, fully managed."
- id: "mla-07-2"
  topic: "07-deployment-infrastructure"
  q: "Large payloads up to 1GB and jobs up to an hour, results can come back later. Which option?"
  a: "Async inference, which queues the request."
- id: "mla-07-3"
  topic: "07-deployment-infrastructure"
  q: "Score a whole dataset nightly. Real-time endpoint?"
  a: "No. Batch transform. A real-time GPU endpoint for nightly scoring is a classic trap."
- id: "mla-07-4"
  topic: "07-deployment-infrastructure"
  q: "When do multi-model endpoints make sense?"
  a: "Many models on a shared framework with sparse per-model traffic. Not when every model is GPU-heavy and always hot."
- id: "mla-07-5"
  topic: "07-deployment-infrastructure"
  q: "Bring compatible external model weights into Bedrock. Which feature?"
  a: "Bedrock Custom Model Import. Watch the format and architecture constraints."
- id: "mla-07-6"
  topic: "07-deployment-infrastructure"
  q: "Retrieval top-k of 50 with no reranking. What's wrong?"
  a: "Context stuffing: more noise and a bigger token bill. Use a reranker and a lower top-k."
- id: "mla-08-1"
  topic: "08-resource-provisioning-and-configuration"
  q: "Bursty hobby traffic on Bedrock. Provisioned throughput?"
  a: "No. On-demand tokens. Provisioned throughput is for steady high QPS or latency SLOs."
- id: "mla-08-2"
  topic: "08-resource-provisioning-and-configuration"
  q: "Good autoscaling metric for a real-time endpoint? For async?"
  a: "Real-time: InvocationsPerInstance, model latency, or GPU utilization. Async: queue depth or backlog."
- id: "mla-08-3"
  topic: "08-resource-provisioning-and-configuration"
  q: "Which two HTTP routes does a SageMaker-compatible serving container implement?"
  a: "/ping and /invocations."
- id: "mla-08-4"
  topic: "08-resource-provisioning-and-configuration"
  q: "Endpoint in a private subnet. How do training and inference jobs reach S3 and ECR?"
  a: "VPC endpoints (S3 gateway, interface endpoints for ECR, SageMaker Runtime, Bedrock) or NAT. Avoid public data paths."
- id: "mla-08-5"
  topic: "08-resource-provisioning-and-configuration"
  q: "KB created once, S3 docs updated since. What's missing?"
  a: "A refresh pipeline: S3 event, then Step Functions or Lambda, then the KB ingest/sync job."
- id: "mla-08-6"
  topic: "08-resource-provisioning-and-configuration"
  q: "Agent forgets context mid-workflow. What wasn't designed?"
  a: "Memory: short-term session history plus long-term AgentCore Memory or an external store."
- id: "mla-09-1"
  topic: "09-cicd-orchestration-mlops"
  q: "Where do you version prompts, model weights, and container images?"
  a: "Prompts: Bedrock Prompt Management. Weights: SageMaker Model Registry (with MLflow sync). Containers: ECR image digests."
- id: "mla-09-2"
  topic: "09-cicd-orchestration-mlops"
  q: "Every successful training run deploys automatically. What's missing?"
  a: "An eval gate: metrics, Bedrock eval, or prompt tests must pass before register and deploy."
- id: "mla-09-3"
  topic: "09-cicd-orchestration-mlops"
  q: "Name four retrain triggers."
  a: "A schedule (EventBridge), drift or quality alarms, new labeled data crossing a threshold, and a manual approval for prod."
- id: "mla-09-4"
  topic: "09-cicd-orchestration-mlops"
  q: "Safe KB refresh pipeline in five steps."
  a: "New docs land in S3, validate with Glue DQ, trigger KB ingestion, run a retrieval eval (hit@k), then promote the app config."
- id: "mla-09-5"
  topic: "09-cicd-orchestration-mlops"
  q: "You can roll back models. What else needs a rollback path?"
  a: "Prompts and agents. Keep previous versions and automate rollback on alarm."
- id: "mla-10-1"
  topic: "10-monitoring-inference-and-performance"
  q: "Data drift vs concept drift?"
  a: "Data drift: the input distribution changes. Concept drift: the relationship between inputs and labels changes."
- id: "mla-10-2"
  topic: "10-monitoring-inference-and-performance"
  q: "Agent returns HTTP 200. Is the task done?"
  a: "Not necessarily. Watch step success, tool error rate, truncated streams, and loops (steps per session)."
- id: "mla-10-3"
  topic: "10-monitoring-inference-and-performance"
  q: "How do you A/B test on SageMaker?"
  a: "Production variants with traffic weights (e.g. 90/10). Compare over equal duration and sample size, promote the winner, keep rollback weights ready."
- id: "mla-10-4"
  topic: "10-monitoring-inference-and-performance"
  q: "Guardrail block rate spikes. Ignore it?"
  a: "No. It's either a safety incident or a UX incident."
- id: "mla-10-5"
  topic: "10-monitoring-inference-and-performance"
  q: "Which Model Monitor baselines can you capture?"
  a: "Data quality, model quality, bias, and feature attribution drift."
- id: "mla-11-1"
  topic: "11-cost-and-performance-optimization"
  q: "Instance cost down 20%, bill still went up. Likely cause?"
  a: "Token spend. RAG context grew. With GenAI, watch dollars per request, not just per hour."
- id: "mla-11-2"
  topic: "11-cost-and-performance-optimization"
  q: "Embedding cost control for a corpus that changes rarely?"
  a: "Cache doc embeddings and re-embed only the deltas, never the whole corpus nightly."
- id: "mla-11-3"
  topic: "11-cost-and-performance-optimization"
  q: "Agent cost formula?"
  a: "Sessions x average steps x tokens per step x tool invocations. Cap max tool loops and set per-agent budgets."
- id: "mla-11-4"
  topic: "11-cost-and-performance-optimization"
  q: "Purchasing option for fault-tolerant training vs steady 24/7 endpoints?"
  a: "Training: Spot with checkpoints. Steady endpoints: Savings Plans or Reserved."
- id: "mla-11-5"
  topic: "11-cost-and-performance-optimization"
  q: "Trace a request across API Gateway, Lambda, and Bedrock. Which tool?"
  a: "AWS X-Ray."
- id: "mla-12-1"
  topic: "12-securing-ml-ai-workloads"
  q: "Are Guardrails access control?"
  a: "No. Guardrails filter model input and output. IAM and retrieval filters decide who sees which documents."
- id: "mla-12-2"
  topic: "12-securing-ml-ai-workloads"
  q: "Bedrock API keys vs IAM credentials. Which is preferred for AWS workloads?"
  a: "IAM roles with temporary credentials. API keys only where long-lived keys are required, stored in Secrets Manager and rotated."
- id: "mla-12-3"
  topic: "12-securing-ml-ai-workloads"
  q: "Block deploys of container images with critical CVEs. Which service?"
  a: "Amazon Inspector scanning ECR images in the CI/CD pipeline."
- id: "mla-12-4"
  topic: "12-securing-ml-ai-workloads"
  q: "Who changed IAM or called SageMaker? vs Is encryption still enabled on that bucket? Which services?"
  a: "CloudTrail for API history. Config for configuration drift."
- id: "mla-12-5"
  topic: "12-securing-ml-ai-workloads"
  q: "Encryption at rest is on. Compliance done?"
  a: "No. You still need audit logging (CloudTrail), network isolation, and least privilege."
